<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>红豆牛奶不加糖 · 一档关于变化的播客</title>
  <meta name="description" content="红豆牛奶不加糖：一档关于变化的播客。AI 在变，年龄在变，身份在变。把变化讲清楚，焦虑就少一点。">
  <meta name="theme-color" content="#fbf4e8">
  <link rel="icon" type="image/png" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="红豆牛奶不加糖">
  <meta property="og:title" content="红豆牛奶不加糖 · 一档关于变化的播客">
  <meta property="og:description" content="AI 在变，年龄在变，身份在变。把变化讲清楚，焦虑就少一点。">
  <meta property="og:image" content="https://czh55.github.io/my_podcast/assets/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="./"><img src="assets/apple-touch-icon.png" alt=""><span>红豆牛奶不加糖</span></a>
    <nav class="site-nav">
      <a href="#latest">最新</a>
      <a href="#episodes">篇目</a>
      <a href="#about">关于</a>
    </nav>
  </header>

  <section class="hero">
    <img class="hero-logo" src="assets/logo.jpg" alt="红豆牛奶不加糖 logo：一杯加了红豆的牛奶">
    <h1 id="site-name">红豆牛奶不加糖</h1>
    <div class="tagline" id="site-tagline">一档关于变化的播客</div>
    <p class="pitch" id="site-pitch">AI 在变，年龄在变，身份在变。把变化讲清楚，焦虑就少一点。</p>
    <div class="hero-actions">
      <a class="btn" href="#latest">▶ 收听最新一期</a>
      <a class="btn ghost" href="#subscribe">订阅</a>
    </div>
  </section>

  <main class="wrap-wide">
    <section id="latest">
      <div class="section-title"><h2>最新一期</h2><span id="latest-sub"></span></div>
      <div id="latest-card"></div>
    </section>

    <section id="subscribe">
      <div class="section-title"><h2>在哪里听</h2><span>平台陆续上线中</span></div>
      <div class="subscribe" id="subscribe-list"></div>
    </section>

    <section id="series-section">
      <div class="section-title"><h2>三种变化</h2><span>点卡片筛选篇目</span></div>
      <div class="series-grid" id="series"></div>
    </section>

    <section id="episodes">
      <div class="section-title"><h2 id="list-title">全部篇目</h2><span id="list-sub"></span></div>
      <div class="chips" id="chips"></div>
      <div class="ep-grid" id="grid"></div>
    </section>

    <section id="about">
      <div class="section-title"><h2>关于我们</h2></div>
      <div class="card about">
        <p id="about-text"></p>
        <div class="hosts" id="hosts"></div>
      </div>
    </section>

    <section id="principles" aria-labelledby="principles-heading">
      <div class="section-title"><h2 id="principles-heading">构思准则</h2><span>做内容时持续打磨的判断标准</span></div>
      <div class="principle-list" id="principle-list"></div>
    </section>
  </main>

  <footer class="site-foot">
    <img src="assets/apple-touch-icon.png" alt="">
    <span>红豆牛奶不加糖 · 一档关于变化的播客</span>
    <span>·</span>
    <a href="WORKFLOW.md">录制工作流</a>
  </footer>

  <script>
    const STATUS_LABEL = {
      outline: '大纲',
      prerecorded: '已预录',
      draft: '草稿',
      edited: '已剪辑',
      published: '已发布',
      slot: '空位'
    };
    const RECORDED = new Set(['edited', 'published']);

    let site = {};
    let seriesList = [];
    let episodes = [];
    let principles = [];
    let activeSeries = 'all';

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSite() {
      document.getElementById('about-text').textContent = site.about || '';
      document.getElementById('hosts').innerHTML = (site.hosts || []).map((h, i) => `
        <div class="host">
          <div class="avatar ${i % 2 ? 'tea' : ''}">${escapeHtml(h.name.slice(-1))}</div>
          <div>
            <h4>${escapeHtml(h.name)}</h4>
            <div class="role">${escapeHtml(h.role)}</div>
            <p>${escapeHtml(h.bio)}</p>
          </div>
        </div>`).join('');
      document.getElementById('subscribe-list').innerHTML = (site.subscribe || []).map(s =>
        s.url
          ? `<a class="btn ghost" href="${escapeHtml(s.url)}"${s.url.startsWith('#') ? '' : ' target="_blank" rel="noopener"'}>${escapeHtml(s.name)}</a>`
          : `<span class="btn soon">${escapeHtml(s.name)} <small>即将上线</small></span>`
      ).join('');
    }

    function renderLatest() {
      const recorded = episodes.filter(e => RECORDED.has(e.status));
      const el = document.getElementById('latest-card');
      if (!recorded.length) {
        el.innerHTML = '<div class="card empty">第一期正在剪辑中，敬请期待。</div>';
        return;
      }
      const ep = recorded[recorded.length - 1];
      const o = ep.outputs || {};
      document.getElementById('latest-sub').textContent = `${ep.date} · ${ep.duration}`;
      el.innerHTML = `
        <article class="card latest">
          <div class="cover"><img src="assets/logo.jpg" alt=""></div>
          <div>
            <div class="kicker">EP${String(ep.episode).padStart(2, '0')} · ${escapeHtml(ep.series_title || '')}</div>
            <h3>${escapeHtml(ep.title)}</h3>
            <p>${escapeHtml(ep.summary || '')}</p>
            ${o.audio ? `<audio class="plain" controls preload="none" src="${o.audio}"></audio>` : ''}
            <div class="row">
              ${o.outline ? `<a class="btn" href="${o.outline}">章节 · 要点 · 文字稿</a>` : ''}
              <div class="tags">${(ep.tags || []).slice(0, 4).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
            </div>
          </div>
        </article>`;
    }

    function renderPrinciples() {
      const el = document.getElementById('principle-list');
      if (!principles.length) {
        el.innerHTML = '<div class="empty" style="padding:24px 0">准则还在酝酿中。</div>';
        return;
      }
      el.innerHTML = principles.map((p, i) => {
        const no = String(i + 1).padStart(2, '0');
        const points = (p.points || []).map(pt =>
          `<li><strong>${escapeHtml(pt.label)}</strong>：${escapeHtml(pt.text)}</li>`
        ).join('');
        return `
          <article class="principle" id="principle-${escapeHtml(p.id)}">
            <div class="principle-no">${no}</div>
            <div>
              <h4 class="principle-title">${escapeHtml(p.title)}</h4>
              ${p.lede ? `<div class="principle-lede">${escapeHtml(p.lede)}</div>` : ''}
              ${p.body ? `<p class="principle-body">${escapeHtml(p.body)}</p>` : ''}
              ${points ? `<ul class="principle-points">${points}</ul>` : ''}
            </div>
          </article>`;
      }).join('');
    }

    function qsSeries() {
      return new URLSearchParams(location.search).get('series') || 'all';
    }

    function setSeries(id, push = true) {
      activeSeries = id;
      if (push) {
        const url = new URL(location.href);
        if (id === 'all') url.searchParams.delete('series');
        else url.searchParams.set('series', id);
        history.replaceState(null, '', url);
      }
      renderChips();
      renderSeries();
      renderEpisodes();
    }

    function renderChips() {
      const el = document.getElementById('chips');
      const items = [{ id: 'all', title: '全部变化' }, ...seriesList];
      el.innerHTML = items.map(s =>
        `<button class="chip ${activeSeries === s.id ? 'active' : ''}" data-id="${s.id}">${s.title}</button>`
      ).join('');
      el.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => setSeries(btn.dataset.id));
      });
    }

    function renderSeries() {
      const el = document.getElementById('series');
      el.innerHTML = seriesList.map(s => {
        const active = activeSeries === s.id ? 'active' : '';
        const on = s.status === 'active';
        const count = episodes.filter(e => e.series === s.id).length;
        return `
          <article class="card series-card ${active}" data-id="${s.id}" style="--accent-color:${s.cover_accent || '#8e2f2c'}">
            <h3>${s.title}</h3>
            <div class="series-meta">${s.kind_label} · ${count} 篇 · ${s.interval}</div>
            <p>${s.theme}</p>
            <div class="series-status ${on ? 'on' : ''}">${on ? '● 进行中' : '○ 计划中'}</div>
          </article>`;
      }).join('');
      el.querySelectorAll('.series-card').forEach(card => {
        card.addEventListener('click', () => {
          setSeries(activeSeries === card.dataset.id ? 'all' : card.dataset.id);
          document.getElementById('episodes').scrollIntoView({ behavior: 'smooth' });
        });
      });
    }

    function renderEpisodes() {
      const list = activeSeries === 'all'
        ? episodes
        : episodes.filter(e => e.series === activeSeries);

      const title = document.getElementById('list-title');
      const sub = document.getElementById('list-sub');
      if (activeSeries === 'all') {
        title.textContent = '全部篇目';
        sub.textContent = `${list.length} 篇 · 已录制 ${list.filter(e => RECORDED.has(e.status)).length} 篇`;
      } else {
        const s = seriesList.find(x => x.id === activeSeries);
        title.textContent = s ? s.title : activeSeries;
        sub.textContent = `${list.length} 篇`;
      }

      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="card empty">这个系列还没有篇目，正在准备中。</div>';
        return;
      }

      grid.innerHTML = list.map(ep => {
        const isSlot = ep.status === 'slot';
        const href = ep.outputs && ep.outputs.outline ? ep.outputs.outline : null;
        const tagHtml = (ep.tags || []).slice(0, 4).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
        const recorded = RECORDED.has(ep.status);
        const foot = recorded && ep.duration
          ? `<span class="note">时长 ${ep.duration} · ${ep.date}</span>`
          : ep.planned_month ? `<span class="note">计划 ${ep.planned_month}</span>` : '';
        const inner = `
          <div class="ep-top">
            <span class="ep-no">EP${String(ep.episode).padStart(2, '0')} · ${escapeHtml(ep.series_title || '')}</span>
            <span class="badge ${recorded ? '' : 'plain'}">${STATUS_LABEL[ep.status] || ep.status}</span>
          </div>
          <h4>${escapeHtml(ep.title)}</h4>
          <p class="summary">${escapeHtml(ep.summary || '')}</p>
          <div class="tags">${tagHtml}</div>
          ${foot}
        `;
        if (href && !isSlot) return `<a class="card ep-card" href="${href}">${inner}</a>`;
        return `<div class="card ep-card" style="opacity:.6">${inner}</div>`;
      }).join('');
    }

    async function boot() {
      const [siteRes, sRes, eRes, pRes] = await Promise.all([
        fetch('site.json'),
        fetch('series.json'),
        fetch('episodes.json'),
        fetch('principles.json')
      ]);
      site = await siteRes.json();
      seriesList = await sRes.json();
      episodes = await eRes.json();
      principles = await pRes.json();
      episodes.sort((a, b) => a.episode - b.episode);
      renderSite();
      renderLatest();
      renderPrinciples();
      setSeries(qsSeries(), false);
    }

    boot().catch(err => {
      document.getElementById('grid').innerHTML =
        `<div class="card empty">加载失败：${err.message}</div>`;
    });
  </script>
</body>
</html>
